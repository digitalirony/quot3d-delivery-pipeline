# Sanitized copy of a production workflow from Quot3D (get-quot3d.com).
# Hostnames, users and private repo names are replaced with GitHub `vars`;
# the generated .env block is trimmed. Logic is otherwise unchanged.
# Stored under workflows/ (not .github/workflows/) so it never runs here.

name: CI - Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test

      - name: Run TypeScript type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Verify app startup (catches route errors)
        working-directory: backend
        run: npm run verify-startup
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test
          NODE_ENV: test

      - name: Run ESLint (if configured)
        working-directory: backend
        run: npm run lint || echo "ESLint not configured, skipping..."
        continue-on-error: true

  frontend-check:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quot3d_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test

      - name: Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test

      - name: Run unit tests
        working-directory: backend
        run: npm run test:unit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quot3d_test
          NODE_ENV: test

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/coverage-final.json
          flags: unittests
          name: unit-tests
        if: always()

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend-unittests
          name: frontend-unit-tests
        if: always()

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull Playwright Linux test image
        run: docker pull mcr.microsoft.com/playwright:v1.59.0-noble

      - name: Run Playwright smoke tests
        working-directory: frontend
        run: npm run test:e2e:smoke -- --reporter=github,html
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          CI: true
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-smoke
          PLAYWRIGHT_HTML_OPEN: never
          VITE_API_URL: https://api.get-quot3d.com
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Upload Playwright smoke report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-smoke
          path: frontend/playwright-report-smoke/
          retention-days: 2

      - name: Run Playwright visual tests
        working-directory: frontend
        run: npm run test:e2e:visual -- --reporter=github,html
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          CI: true
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-visual
          PLAYWRIGHT_HTML_OPEN: never
          VITE_API_URL: https://api.get-quot3d.com
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Upload Playwright visual report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-visual
          path: frontend/playwright-report-visual/
          retention-days: 2
